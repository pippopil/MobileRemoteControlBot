plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildNumber = 1
if (System.getenv("BUILD_NUMBER") != null && !System.getenv("BUILD_NUMBER").isEmpty()) {
    try {
        buildNumber = System.getenv("BUILD_NUMBER").toInteger()
    } catch (Exception ignored) {
        buildNumber = 1
    }
}
def buildVersion = (System.getenv("BUILD_VERSION") != null && !System.getenv("BUILD_VERSION").isEmpty()) ? System.getenv("BUILD_VERSION") : "1.0.1"

android {
    namespace 'com.pippopil.mobileremotecontrolbot'
    compileSdk 34

    defaultConfig {
        applicationId "com.pippopil.mobileremotecontrolbot"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName buildVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
