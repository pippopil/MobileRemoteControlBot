<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Robot Antenna -->
  <line x1="256" y1="190" x2="256" y2="135" stroke="url(#botGrad)" stroke-width="14" stroke-linecap="round" />
  <circle cx="256" cy="120" r="18" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- Side ears -->
  <rect x="110" y="240" width="22" height="48" rx="8" fill="#38bdf8" />
  <rect x="380" y="240" width="22" height="48" rx="8" fill="#38bdf8" />
  
  <!-- Robot Head -->
  <rect x="130" y="180" width="252" height="170" rx="42" fill="url(#botGrad)" />
  
  <!-- Screen Visor -->
  <rect x="156" y="206" width="200" height="118" rx="28" fill="#0f172a" />
  
  <!-- Glowing Eyes -->
  <circle cx="210" cy="256" r="20" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="302" cy="256" r="20" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="210" cy="256" r="8" fill="#ffffff" />
  <circle cx="302" cy="256" r="8" fill="#ffffff" />
  
  <!-- Mouth / Signal Waves -->
  <rect x="220" y="296" width="72" height="8" rx="4" fill="#38bdf8" />
</svg>
