name: Android Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Configure Android SDK & Accept Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Application (PWA)
        run: |
          npm run build

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/

      - name: Extract Commit Information
        id: commit_info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "commit_msg<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Compile Android APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION: 1.0.${{ github.run_number }}
        run: |
          cd android
          gradle assembleRelease --stacktrace --no-daemon
          cd ..
          
          # Find output apk and rename with version number
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "MobileRemoteControlBot-v1.0.${{ github.run_number }}.apk"
            echo "APK ready: MobileRemoteControlBot-v1.0.${{ github.run_number }}.apk"
          else
            echo "Error: APK was not generated!"
            exit 1
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "BotHub Pro — Релиз v1.0.${{ github.run_number }}"
          body: |
            ## 📱 BotHub Pro / MobileRemoteControlBot (Сборка #${{ github.run_number }})
            
            ### 📝 Изменения в этом обновлении:
            ${{ steps.commit_info.outputs.commit_msg }}
            
            ---
            - **Коммит:** `${{ steps.commit_info.outputs.short_sha }}`
            - **Автор:** `${{ github.actor }}`
            - **Сборка:** `#${{ github.run_number }}`
            - **Дата релиза:** ${{ github.event.head_commit.timestamp || 'Сейчас' }}
            
            ### 📥 Установка приложения:
            - **Android:** Скачайте прикрепленный файл `MobileRemoteControlBot-v1.0.${{ github.run_number }}.apk` и установите на смартфон.
            - **iOS / Desktop / Web:** Откройте веб-версию в браузере и нажмите «Установить PWA» для нативной работы на iPhone, iPad, Windows или macOS.
          files: |
            MobileRemoteControlBot-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
